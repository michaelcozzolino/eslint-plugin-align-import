name: CI

on: [push, pull_request]

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Use Node.js 24.x
                uses: actions/setup-node@v4
                with:
                    node-version: 24.x

            -   name: Install dependencies, build, lint and test
                run: |
                    corepack enable
                    yarn install
                    yarn lint
                    yarn test
